  <path d="M120 360q14 34 4 70" fill="none" stroke="#D98E73" stroke-width="2.5"/>
  <!-- flow channels toward knee & groin -->
  <g fill="none" stroke="#0E6F6A" stroke-width="2.5" stroke-linecap="round">
    <path d="M318 300Q262 262 218 272Q160 282 104 330"/>
    <path d="M306 274Q258 240 214 250Q150 262 92 312" opacity="0.7"/>
    <path d="M294 248Q254 220 210 228Q140 242 80 294" opacity="0.45"/>
  </g>
  <circle cx="104" cy="330" r="7" fill="#0E6F6A"/>
  <circle cx="218" cy="298" r="5" fill="#0E6F6A"/>
  <!-- therapist arms & open palms -->
  <path d="M388 254L340 352" stroke="#A87B2E" stroke-width="20" stroke-linecap="round"/>
  <path d="M410 246L286 326" stroke="#A87B2E" stroke-width="20" stroke-linecap="round"/>
  <path d="M388 254l-4 8M410 246l-8 6" stroke="#0E6F6A" stroke-width="28" stroke-linecap="round"/>
  <ellipse cx="331" cy="364" rx="30" ry="12" fill="#A87B2E" transform="rotate(25 331 364)"/>
  <ellipse cx="275" cy="338" rx="30" ry="12" fill="#A87B2E" transform="rotate(25 275 338)"/>
</svg>
