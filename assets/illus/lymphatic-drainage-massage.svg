  <path d="M122 148v132" stroke="#EEF2F1" stroke-width="3"/>
  <!-- floor -->
  <rect y="480" width="480" height="120" fill="#BFDCD6" opacity="0.6"/>
  <!-- therapist -->
  <path d="M370 236q42-30 86-10q16 80 8 254h-92z" fill="#0E6F6A"/>
  <circle cx="414" cy="182" r="28" fill="#A87B2E"/>
  <path d="M388 178q2-32 34-32q22 4 20 24q-28-10 -54 8z" fill="#14233A"/>
  <!-- table -->
  <rect x="60" y="450" width="14" height="96" fill="#0A4F4B"/>
  <rect x="356" y="450" width="14" height="96" fill="#0A4F4B"/>
  <rect x="30" y="430" width="380" height="22" rx="10" fill="#0A4F4B"/>
  <!-- leg with bent knee -->
  <path d="M70 404L218 326" stroke="#D9A57B" stroke-width="54" stroke-linecap="round"/>
  <path d="M218 326L372 408" stroke="#D9A57B" stroke-width="40" stroke-linecap="round"/>
  <path d="M362 418q14-48 34-42q10 4 6 22l-10 30z" fill="#D9A57B"/>
